name: Test and deploy static content to Pages

on:
  push:
    branches: ["main", "feature/more-poster-backgrounds", "feature/audit-email-project-save-final", "feature/editor-overlays-borders-qr-history"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/poster-core.test.mjs
      - run: node tests/project-and-render.test.mjs
      - run: node tests/editor-features.test.mjs
      - name: Parse browser modules and mail server
        run: |
          node --input-type=module --check < app-v2.js
          node --input-type=module --check < background-art.js
          node --input-type=module --check < email-client.js
          node --input-type=module --check < poster-core.js
          node --input-type=module --check < render-random.js
          node --input-type=module --check < project-state.js
          test ! -f editor-features.js || node --input-type=module --check < editor-features.js
          node --check server/server.js

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
